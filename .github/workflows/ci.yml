name: Python CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  python-tests:
    name: python-tests-${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev]'
      - run: python -m pytest -q
      - run: python examples/poisson/demo.py --output /tmp/capsule-demo
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - name: Install built wheel and verify handover
        run: |
          python -m venv /tmp/capsule-wheel
          /tmp/capsule-wheel/bin/python -m pip install "$(find dist -name '*.whl' -print -quit)[science,mcp]"
          /tmp/capsule-wheel/bin/capsule-maker --help
          /tmp/capsule-wheel/bin/capsule-maker-mcp --help
          mkdir -p /tmp/capsule-wheel-plugin
          /tmp/capsule-wheel/bin/capsule-maker prepare-plugin --workspace /tmp/capsule-wheel-plugin --marketplace wheel-ci
          /tmp/capsule-wheel/bin/python examples/poisson/demo.py --output /tmp/capsule-wheel-demo
      - name: Upload release candidate distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
