   nrepmax_occ_ctrl                    : 1 #      Number of re-diagonalizations of occupancy control scheme.
   alpha_hf                            : -1.0 #   Part of the exact exchange contribution for hybrid functionals
 geopt:
   betax                               : 1.0 #    Stepsize for the geometry optimization
   forcemax                            : 0.0002 # Max forces criterion when stop
   frac_fluct                          : 1.0 #    Fraction of force fluctuations. Stop if fmax < forces_fluct*frac_fluct
   method                              : SQNM #   Geometry optimisation method
   ncount_cluster_x                    : 300 #    Maximum number of force evaluations
