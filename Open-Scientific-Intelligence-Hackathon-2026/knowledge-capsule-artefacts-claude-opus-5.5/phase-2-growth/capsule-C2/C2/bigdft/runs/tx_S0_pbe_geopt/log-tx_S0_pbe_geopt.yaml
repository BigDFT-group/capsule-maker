   forcemax                            : 0.0002 # Max forces criterion when stop
   randdis                             : 0. #     Random displacement amplitude
   nhistx                              : 10 #     Maximum history length
   biomode                             : No #     Enable mode for biomolecules.
   beta_stretchx                       : 5e-1 #   Stepsize for steepest descent in stretching mode direction (only if in biomode)
