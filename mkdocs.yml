site_name: Capsule-Maker
site_url: https://bigdft-group.github.io/capsule-maker/
repo_url: https://github.com/BigDFT-group/capsule-maker
edit_uri: edit/main/docs/
site_description: Portable research memory for reproducible AI-assisted science
use_directory_urls: false
theme:
  name: mkdocs
  color_mode: light
  user_color_mode_toggle: true
nav:
  - Project: index.md
  - Quick start:
      - Create a capsule: quickstart-create.md
      - Retrieve a capsule: quickstart-retrieve.md
      - Reuse PSolver with an agent: reuse-psolver.md
      - How the harness uses capsule knowledge: psolver-knowledge.md
  - Architecture: architecture.md
  - Capsule format: format.md
  - CLI, MCP, and Skill: interfaces.md
  - Memory adapters: integrations.md
  - Security: security.md
  - Scientific demonstration: demonstration.md
  - Capsule evolution and PSolver: evolution.md
  - Example capsules:
      - Poisson and periodic PSolver: capsules/psolver-periodic-v1/index.md
  - Contributor requirements: quality.md
  - Maintain the documentation: contributing.md
  - Roadmap and decisions: roadmap.md
  - Alpha release: releases/v0.1.0-alpha.md
extra_css:
  - stylesheets/project.css
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
